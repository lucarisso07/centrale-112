name: Verifica del progetto
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test offline
        run: npm test
      - name: Verifica HTML e sorgenti
        run: npm run check:build
      - name: Verifica integrità della copia originale
        run: npm run verify:original
